trigger:
- sara

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build and Push Docker image
    pool:
      vmImage: ubuntu-latest
    steps:
    # Step 1: Build Docker image
    - task: Docker@2
      displayName: Build Docker image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          sarakitchen.azurecr.io/test-db-backend:$(tag)

    # Step 2: Push Docker image to Azure Container Registry
    - task: Docker@2
      displayName: Push Docker image to ACR
      inputs:
        command: push
        containerRegistry: 'saraKitchen' # Service connection name
        repository: 'sarakitchen.azurecr.io/test-db-backend'
        tags: |
          $(tag)
