trigger:
- sara

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)' # Koristi Build ID kao tag

stages:
- stage: Build
  displayName: Build and Push image
  jobs:
  - job: Build
    displayName: Build and Push Docker image
    pool:
      vmImage: ubuntu-latest
    steps:
    # Jedan korak za build i push
    - task: Docker@2
      displayName: Build and Push Docker image to ACR
      inputs:
        containerRegistry: 'saraKitchen'  # Service connection name
        repository: 'repo'  # Naziv repozitorijuma bez URL-a
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)
    
    # Opcionalno: Listanje Docker imidža za proveru
    - script: docker images
      displayName: 'List Docker Images'
